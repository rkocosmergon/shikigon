[project]
name = "shikigon-brain"
version = "0.1.9"
description = "Shikigon's brain: a Cosmergon agent that wants to play."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # >=0.27.10: the terminal client hands the brain the [M] question on stdin, never as an
    #   argument (marketplace review); >=0.27.0 brought [M] itself (COSMERGON_ADVISOR_CMD);
    # 0.26.0 brought mission_word / mission_outcome_text (cos20 #475).
    # [dashboard]: "open terminal" starts cosmergon-dashboard, which needs textual; without
    # the extra the client only prints how to install it (seen in a fresh container, 11.10.2026).
    "cosmergon-agent[dashboard]>=0.27.16",
    # >=2.3.9: missions only on fields the server names ready, a contract it cannot accept is
    #   rejected (cos20 #529).
    "cosmergon-decider-tree>=2.3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E501 is not among ruff's defaults; without it the line length above was never checked.
extend-select = ["E501"]

[tool.mypy]
# The brain is a folder of plain modules, not a package: run `mypy` from the repo root.
files = ["brain"]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
# The rule tree ships no type information (cosmergon-agent does: py.typed).
module = ["cosmergon_decider_tree", "cosmergon_decider_tree.*"]
ignore_missing_imports = true
