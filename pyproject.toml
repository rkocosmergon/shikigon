[project]
name = "shikigon-brain"
version = "0.1.14"
description = "Shikigon's brain: a Cosmergon agent that wants to play."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # >=0.28.2: the shop in the terminal ([S], agent.buy) and the catalog the README names
    #   (cos20 #603, #609, #610); 0.28.1 no paid request sent twice (cos20 #606).
    # >=0.27.34: an answer of the world in the wrong form (no JSON, a list for an object, a
    #   number that is not finite, nesting too deep) ends no reader, Retry-After read by its
    #   form (cos20 #492, sixth review).
    # >=0.27.33: every answer of the world without control characters (not only the state),
    #   missions() at most 50, refresh_state() raises on 401/403 so a key that ended is told
    #   apart from a world that did not answer (cos20 #492, fifth review).
    # >=0.27.32: the state is read in its declared types (numbers as numbers, every string
    #   without control characters), https only to the browser, the advisor ends with SIGTERM,
    #   ~/.cosmergon private from the first byte (cos20 #492, fourth review).
    # >=0.27.31: one deadline for every request, the head of its answer included, and the two
    #   dialogs of the terminal show the server's words as text (cos20 #492, third review).
    # >=0.27.30: the terminal client takes the key on a file descriptor (--api-key-fd), and
    #   shows the server's words as text (cos20 #492 B4, B7).
    # >=0.27.10: the terminal client hands the brain the [M] question on stdin, never as an
    #   argument (marketplace review); >=0.27.0 brought [M] itself (COSMERGON_ADVISOR_CMD);
    # 0.26.0 brought mission_word / mission_outcome_text (cos20 #475).
    # [dashboard]: "open terminal" starts cosmergon-dashboard, which needs textual; without
    # the extra the client only prints how to install it (seen in a fresh container, 11.10.2026).
    "cosmergon-agent[dashboard]>=0.28.2",
    # >=2.3.10: the facts of the world read in their form, ready_fields as one set (cos20 #492,
    #   sixth review). >=2.3.9: missions only on fields the server names ready, a contract it
    #   cannot accept is rejected (cos20 #529).
    "cosmergon-decider-tree>=2.3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E501 is not among ruff's defaults; without it the line length above was never checked.
extend-select = ["E501"]

[tool.mypy]
# The brain is a folder of plain modules, not a package: run `mypy` from the repo root.
files = ["brain"]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
# The rule tree ships no type information (cosmergon-agent does: py.typed).
module = ["cosmergon_decider_tree", "cosmergon_decider_tree.*"]
ignore_missing_imports = true
